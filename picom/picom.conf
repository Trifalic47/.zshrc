#################################
# Core Performance & Backend
#################################
backend = "glx";
vsync = true;
use-damage = true;
glx-no-stencil = true;
unredir-if-possible = true; # Drops Picom overhead when playing fullscreen games/videos

#################################
# Visual Effects
#################################
corner-radius = 2;

# Opacity Rules (Kitty @ 90%)
opacity-rule = [
  "90:class_g = 'kitty'"
];

# Dual-Kawase Blur (Restricted to Kitty only)
blur-method = "dual_kawase";
blur-strength = 3;
blur-background = true;
blur-background-exclude = [
  "class_g != 'kitty'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
# Window Specific Overrides
#################################
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.90; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};

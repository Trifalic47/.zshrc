# ===== KODA DARK THEME =====

# status bar base (deep dark + soft contrast)
set -g status-style "bg=#0f111a,fg=#a9b1d6"

# LEFT (session) - subtle cyan accent
set -g status-left "#[fg=#7dcfff,bold] #S "

# RIGHT (time) - muted, not distracting
set -g status-right "#[fg=#565f89]%H:%M "

# WINDOWS (inactive = muted, active = bright cyan)
set -g window-status-format " #[fg=#565f89]#I:#W "
set -g window-status-current-format "#[fg=#7dcfff,bold] #I:#W "

# BORDER (clean separation, no neon chaos)
set -g pane-border-style "fg=#1a1b26"
set -g pane-active-border-style "fg=#7dcfff"

# PREFIX
unbind C-b
set -g prefix C-s
bind C-a send-prefix

# BASICS
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-window on
set -g history-limit 10000
set -g escape-time 0

# TERMINAL
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# NAVIGATION (vim style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# RESIZE
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# SPLITS
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# COPY MODE
setw -g mode-keys vi
set -g pane-border-style fg="#2b2d3a"

# Active pane border
set -g pane-active-border-style fg="#2b2d3a"
set -g pane-border-lines single
##### Pane Borders #####
set -g pane-border-style "fg=#2e2e38"
set -g pane-active-border-style "fg=#bccaeb"

# Palette
set -g @bg      "#1c1c26"
set -g @bg2     "#2e2e38"
set -g @accent  "#bccaeb"

# Status bar
set -g status-style "bg=#1c1c26,fg=#bccaeb"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60

# Left
set -g status-left "#[fg=#1c1c26,bg=#bccaeb,bold]  #[fg=#bccaeb,bg=#2e2e38] #S #[default]"

# Current window
setw -g window-status-current-format "#[fg=#1c1c26,bg=#bccaeb,bold] #I:#W "

# Inactive windows
setw -g window-status-format "#[fg=#6d748c,bg=#1c1c26] #I:#W "

# Right
set -g status-right "#[fg=#6d748c] #[fg=#bccaeb]#(whoami) #[fg=#6d748c]@#[fg=#bccaeb]#H #[fg=#6d748c] #[fg=#bccaeb]%H:%M #[fg=#6d748c]%d-%b-%y"
